[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manycore-aholo-sdk-core"
version = "1.2.0"
description = "Aholo Open API shared HTTP client, errors, and polling utilities"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/manycoretech/aholo-spatial-sdk"
Repository = "https://github.com/manycoretech/aholo-spatial-sdk"
Issues = "https://github.com/manycoretech/aholo-spatial-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/manycore"]
